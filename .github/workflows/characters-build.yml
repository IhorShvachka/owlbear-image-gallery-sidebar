name: Build Characters extension

on:
  push:
    branches: [feature/characters-extension]
    paths:
      - "characters-extension/**"
      - ".github/workflows/characters-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "characters-extension/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: characters-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: characters-extension/package.json

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build
